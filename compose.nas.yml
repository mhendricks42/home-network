name: homelab-nas

services:
  # Append-only restic backup target for odin and vidar (docs/go-live.md, E3).
  rest-server:
    image: restic/rest-server:0.13.0
    restart: unless-stopped
    ports: ["10.0.40.20:8000:8000"]
    environment:
      OPTIONS: --append-only --private-repos
    volumes:
      - /volume1/backups/restic:/data
