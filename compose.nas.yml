name: homelab-nas

services:
  # Append-only restic backup target for odin and vidar (docs/go-live.md, E3).
  rest-server:
    image: restic/rest-server:0.13.0
    restart: unless-stopped
    ports: ["10.0.40.20:8000:8000"]
    environment:
      OPTIONS: --append-only --private-repos
    volumes:
      - /volume1/backups/restic:/data

  # Host metrics (CPU, RAM, disks, temps) for Home Assistant's Glances integration.
  # API only, on the NAS address; allow TCP 61208 from odin (10.0.40.10) in the NAS firewall.
  glances:
    image: nicolargo/glances:4.5.9-full
    restart: unless-stopped
    network_mode: host                    # host network stats; bound to the NAS IP below
    pid: host                             # host processes and load, not just the container's
    environment:
      GLANCES_OPT: "-w --disable-webui -B 10.0.40.20 -t 30"
      TZ: America/New_York
    volumes:
      - /volume1:/volume1:ro              # disk usage: system/apps volume
      - /volume2:/volume2:ro              # disk usage: media volume
      - ./services/glances/glances.conf:/glances/conf/glances.conf:ro   # hides Docker internals
