# Network health dashboard (built-in cards only). Setup: docs/ha-dashboard.md.
# Tabs: Overview (status, coloured), Resources (gauges), Network (DNS, UPS, history).
# Each Kuma check is a pair of tiles with visibility conditions: green while "up", red otherwise.
# Temperature gauges are in °F (HA here uses US customary units).
# Check entity IDs: bash scripts/check-ha-entities.sh services/homeassistant/dashboards/network-health.yaml
title: Network health
views:
- title: Overview
  path: overview
  icon: mdi:view-dashboard
  type: sections
  max_columns: 3
  badges:
  - entity: sensor.kuma_internet_status
    name: Internet
  - entity: sensor.ups_office_status_data
    name: Office UPS
  - entity: sensor.ups_closet_status_data
    name: Closet UPS
  - entity: switch.adguard_odin_protection
    name: DNS filter
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Problems
      icon: mdi:alert-circle-outline
    - type: markdown
      grid_options:
        columns: 12
      content: '{% set ns = namespace(n=0, t=0, down=[]) %}{% for e in [''anubis'', ''odin'', ''vidar'', ''mimir'', ''internet'',
        ''dns_odin'', ''dns_vidar'', ''home_assistant'', ''certificate'', ''forgejo'', ''jellyfin'', ''seerr'', ''sonarr'',
        ''sonarr_health'', ''radarr'', ''radarr_health'', ''prowlarr'', ''prowlarr_health'', ''sabnzbd'', ''qbittorrent'']
        %}{% set ns.t = ns.t + 1 %}{% if is_state(''sensor.'' ~ ''kuma_'' ~ e ~ ''_status'', ''up'') %}{% set ns.n = ns.n
        + 1 %}{% else %}{% set ns.down = ns.down + [e] %}{% endif %}{% endfor %}{% if ns.down %}<ha-alert alert-type="error">**{{
        ns.t - ns.n }} of {{ ns.t }} checks failing:** {{ ns.down | join('', '') | replace(''_'', '' '') }}</ha-alert>{% else
        %}<ha-alert alert-type="success">**All {{ ns.t }} checks up.** Uptime Kuma on vidar alerts even when odin is down.</ha-alert>{%
        endif %}'
