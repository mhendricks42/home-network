- title: Resources
  path: resources
  icon: mdi:chip
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: odin
      icon: mdi:server
    - type: gauge
      entity: sensor.odin_processor_use
      name: CPU
      needle: true
      severity:
        green: 0
        yellow: 60
        red: 85
      grid_options:
        columns: 4
        rows: 2
    - type: gauge
      entity: sensor.odin_memory_usage
