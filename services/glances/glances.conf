# Glances on mimir (compose.nas.yml). Hide Docker and system internals so Home
# Assistant only gets real interfaces, disks and volumes (regex, comma-separated).
[network]
hide=lo,veth.*,br-.*,docker.*

[diskio]
hide=loop.*,zram.*,dm-.*,mmcblk0boot.*,mmcblk0p.*,md.*

[fs]
hide=/etc/.*,/volume.*/@docker.*,/volume1/@docker/.*
